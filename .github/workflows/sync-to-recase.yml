name: Sync to Recase Git Repository # نام Workflow شما

on:
  push:
    branches:
      - develop # این Workflow وقتی روی برنچ 'develop' پوش می‌کنید، اجرا می‌شود.
      # اگر برنچ اصلی شما نام دیگری دارد (مثلاً master)، آن را اینجا تغییر دهید.

  workflow_dispatch: # اضافه کردن این بخش برای اجرای دستی Workflow
    inputs:
      commit_message:
        description: 'Custom commit message for Recase Git (optional)' # توضیحات برای ورودی
        required: false # این ورودی اختیاری است
        type: string # نوع ورودی رشته است

jobs:
  sync:
    runs-on: ubuntu-latest # سیستم عاملی که Workflow روی آن اجرا می‌شود

    steps:
      - name: Checkout current repository # چک کردن کد ریپازیتوری فعلی (Repo A)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # برای اطمینان از دسترسی به تاریخچه کامل Git (اگر نیاز به تاریخچه دارید)

      - name: Configure Git User # تنظیم نام کاربری و ایمیل برای کامیت‌های خودکار
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone and Sync to Recase Git # کلون کردن ریپازیتوری مقصد و اعمال تغییرات
        run: |
          # نام پوشه‌ای که ریپازیتوری مقصد در آن کلون می‌شود
          RECASE_REPO_DIR="recase-front-clone"
          
          # آدرس کامل ریپازیتوری مقصد با استفاده از GitLab Personal Access Token (PAT)
          # فرمت: https://oauth2:<YOUR_PAT>@your-gitlab-domain/group/repo.git
          # GitHub Secrets به صورت امن در زمان اجرا جایگزین می‌شوند.
          RECASE_REPO_URL="https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@git.recase.ir/aed_group/aed_management_front.git" 
          
          # برنچ مقصد در ریپازیتوری git.recase.ir
          TARGET_BRANCH="main" # برنچ مقصد در git.recase.ir که تغییرات روی آن پوش می‌شوند.

          echo "Cloning Recase repository..."
          # کلون کردن ریپازیتوری مقصد. Git به صورت خودکار از PAT استفاده می‌کند.
          git clone --depth 1 --branch $TARGET_BRANCH "$RECASE_REPO_URL" "$RECASE_REPO_DIR"

          echo "Copying files from current repo to Recase repo..."
          # حذف تمام محتوای پوشه مقصد (به جز پوشه .git) برای اطمینان از همگام‌سازی کامل
          # این خط بسیار مهم است و باید با دقت استفاده شود.
          # اگر نمی‌خواهید تمام محتوا جایگزین شود، این خط را کامنت کنید یا تغییر دهید.
          find "$RECASE_REPO_DIR" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # --- تغییر در این خط: کپی کردن تمام فایل‌ها به جز پوشه کلون شده و .git مبدأ ---
          # این دستور تمام فایل‌ها و پوشه‌ها (شامل فایل‌های مخفی) را از دایرکتوری فعلی (ریپو گیت‌هاب) کپی می‌کند،
          # به جز پوشه‌ای که ریپازیتوری مقصد در آن کلون شده است و پوشه .git ریپازیتوری مبدأ.
          shopt -s dotglob # برای شامل کردن فایل‌های مخفی (dotfiles)
          shopt -s extglob # برای فعال کردن الگوهای پیشرفته (مثل !(a|b))
          cp -r !(recase-front-clone|.git) "$RECASE_REPO_DIR/"
          # ----------------------------------------------------------------------------------

          echo "Navigating to Recase repository directory..."
          # وارد شدن به پوشه ریپازیتوری مقصد
          cd "$RECASE_REPO_DIR"

          echo "Adding changes to Git..."
          # اضافه کردن تمام تغییرات به Git
          git add .

          echo "Checking for changes..."
          # بررسی اینکه آیا تغییری برای کامیت وجود دارد یا خیر
          if git diff --staged --quiet; then
            echo "No changes detected in Recase repository. Skipping commit and push."
          else
            # --- تغییر در این خط: کامیت کردن با پیام سفارشی یا پیام آخرین پوش ---
            COMMIT_MSG="${{ github.event.inputs.commit_message || github.event.head_commit.message || 'Automated sync from GitHub Actions' }}"
            git commit -m "$COMMIT_MSG" 
            # ------------------------------------------------------------------
          
            echo "Pushing changes to Recase repository..."
            # پوش کردن تغییرات به برنچ مقصد
            git push origin "$TARGET_BRANCH"
            echo "Successfully pushed changes to Recase repository."
          fi
